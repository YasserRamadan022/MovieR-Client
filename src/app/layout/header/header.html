<header 
  [class.scrolled]="isScrolled"
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
>

  <!-- Completely Transparent - No Background, No Blur -->
  <div 
    class="absolute inset-0 border-b border-border-dark/10 transition-all duration-300"
    [ngClass]="{'bg-deep-black/95 backdrop-blur-md': isScrolled}"
  ></div>

  <nav class="relative container mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 md:h-20">
      
<a routerLink="/" class="flex items-center space-x-4 group cursor-pointer relative z-10">
    <div class="absolute -inset-2 bg-slate-dark opacity-0 group-hover:opacity-20 transition-opacity duration-500 rounded-lg blur-sm"></div>
    
  <!-- <div class="relative flex items-center">
    <span class="text-text-soft font-normal text-4xl md:text-5xl leading-none" 
          style="font-family: 'Inter', 'Roboto', 'Helvetica Neue', sans-serif; font-weight: 400; letter-spacing: -0.1em;">
      WM
    </span>
  </div> -->
  
    
    <!-- Text - Watch Movie -->
    <div class="flex flex-col">
      <span class="text-text-soft font-semibold text-lg md:text-xl tracking-tight leading-none">
        Watch<span class="text-steel-blue font-light">Movie</span>
      </span>
      <span class="text-xs text-steel-blue/60 font-light tracking-wider uppercase hidden sm:block">Cinema</span>
    </div>
  </a>

      <!-- Desktop Navigation - Clean and Professional -->
      <div class="hidden lg:flex items-center space-x-1">
        @for (item of navItems; track item.route) {
          <a 
            [routerLink]="item.route" 
            routerLinkActive="bg-slate-dark text-text-soft border border-steel-blue/20"
            class="relative px-5 py-2.5 rounded-md text-steel-blue hover:text-text-soft transition-all duration-200 font-medium text-sm xl:text-base group"
          >
            <!-- Subtle Hover Background -->
            <div class="absolute inset-0 bg-slate-dark/50 opacity-0 group-hover:opacity-100 transition-opacity duration-200 rounded-md"></div>
            
            <!-- Text -->
            <span class="relative z-10">{{ item.label }}</span>
            
            <!-- Bottom Border on Hover -->
            <div class="absolute bottom-0 left-0 w-0 h-0.5 bg-steel-blue group-hover:w-full transition-all duration-300"></div>
          </a>
        }
      </div>

      <!-- Right Side Actions -->
      <div class="flex items-center space-x-3">
        
        <!-- Professional Search Bar -->
        <div class="relative flex items-center">
          <!-- Search Input Container -->
          <div 
            [class]="isSearchOpen ? 'w-56 md:w-72 opacity-100' : 'w-0 opacity-0'"
            class="transition-all duration-300 overflow-hidden mr-2"
          >
            <div class="relative">
              <!-- Search Input - Minimal Design -->
              <input 
                type="text" 
                [(ngModel)]="searchQuery"
                placeholder="Search..."
                class="w-full px-4 py-2 bg-charcoal border border-border-dark rounded-md text-text-soft placeholder-steel-blue/50 focus:outline-none focus:border-steel-blue/50 focus:bg-slate-dark transition-all duration-200 text-sm"
              />
            </div>
          </div>
          
          <!-- Search Button - Minimal -->
          <button 
            (click)="toggleSearch()"
            [class]="isSearchOpen ? 'bg-slate-dark text-text-soft border border-steel-blue/30' : 'text-steel-blue hover:text-text-soft hover:bg-slate-dark/50'"
            class="w-9 h-9 rounded-md transition-all duration-200 flex items-center justify-center border border-transparent"
            aria-label="Search"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </button>
        </div>
        
        <!-- Mobile Menu Button - Minimal -->
        <button 
          (click)="toggleMenu()"
          class="lg:hidden w-9 h-9 rounded-md text-steel-blue hover:text-text-soft hover:bg-slate-dark/50 transition-all duration-200 flex items-center justify-center border border-transparent hover:border-steel-blue/30"
          aria-label="Toggle menu"
        >
          <svg class="w-5 h-5 transition-transform duration-300" [class.rotate-90]="isMenuOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            @if (!isMenuOpen) {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            } @else {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            }
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu - Clean Design -->
    @if (isMenuOpen) {
      <div class="lg:hidden py-4 space-y-1 animate-fadeIn border-t border-border-dark mt-2">
        @for (item of navItems; track item.route) {
          <a 
            [routerLink]="item.route"
            (click)="toggleMenu()"
            routerLinkActive="bg-slate-dark text-text-soft border-l-2 border-steel-blue"
            class="block px-4 py-3 rounded-md text-steel-blue hover:text-text-soft hover:bg-slate-dark/50 transition-all duration-200 font-medium"
          >
            {{ item.label }}
          </a>
        }
      </div>
    }
  </nav>
</header>
