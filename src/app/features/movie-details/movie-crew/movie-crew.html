<!-- movie-crew.component.html -->
<section class="py-8 sm:py-12 md:py-16 border-t border-steel-blue/10 bg-gradient-to-b from-transparent to-slate-900/30" aria-label="Movie cast and crew">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Top Cast Section -->
    <div class="cast-section mb-8 sm:mb-10 md:mb-12">
      <h2 class="text-2xl sm:text-3xl md:text-4xl font-bold text-text-soft mb-6 sm:mb-8 pb-3 sm:pb-4 border-b border-steel-blue/30">
        Top Cast
      </h2>
      <div class="flex flex-wrap justify-start gap-4 sm:gap-6 md:gap-8 lg:gap-10">
        @if (actors().length > 0) {
          @for (actor of actors(); track actor.id) {
            <div class="group cursor-pointer flex flex-col items-center" [routerLink]="['/actor', actor.id]" >
              <div class="relative w-20 h-20 xs:w-24 xs:h-24 sm:w-28 sm:h-28 md:w-32 md:h-32 lg:w-36 lg:h-36 rounded-full overflow-hidden mb-3 sm:mb-4 bg-gradient-to-br from-steel-blue/20 to-slate-800/40 shadow-lg ring-2 ring-steel-blue/20 transition-all duration-300 hover:shadow-xl hover:shadow-steel-blue/20 hover:ring-steel-blue/40">
                <img 
                  [src]="actor.imageUrl" 
                  [alt]="actor.name + ' photo'"
                  class="w-full h-full object-cover object-center transition-transform duration-500 group-hover:scale-110"
                />
                <!-- Gradient overlay on hover -->
                <div class="absolute inset-0 bg-gradient-to-t from-deep-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
              </div>
              <div class="text-center w-full max-w-[100px] xs:max-w-[120px] sm:max-w-[140px] md:max-w-[160px]">
                <h3 class="text-xs xs:text-sm sm:text-base font-semibold text-text-soft mb-1 break-words line-clamp-2 group-hover:text-steel-blue transition-colors duration-200">
                  {{ actor.name }}
                </h3>
                <p class="text-[10px] xs:text-xs sm:text-sm text-steel-blue/70 break-words line-clamp-2">
                  
                </p>
              </div>
            </div>
          }
        } @else {
          <div class="w-full py-8 sm:py-10 md:py-12 text-left">
            <p class="text-sm sm:text-base text-steel-blue/60 italic">No cast information available.</p>
          </div>
        }
      </div>
    </div>

    <!-- Director Section -->
    <div class="director-section">
      <h2 class="text-2xl sm:text-3xl md:text-4xl font-bold text-text-soft mb-6 sm:mb-8 pb-3 sm:pb-4 border-b border-steel-blue/30">
        Director
      </h2>
      @if (director()) {
        <div class="group cursor-pointer flex flex-col items-start w-fit">
          <div class="relative w-28 h-28 xs:w-32 xs:h-32 sm:w-36 sm:h-36 md:w-40 md:h-40 lg:w-44 lg:h-44 rounded-full overflow-hidden mb-4 sm:mb-5 bg-gradient-to-br from-steel-blue/20 to-slate-800/40 shadow-lg ring-2 ring-steel-blue/20 transition-all duration-300 hover:shadow-xl hover:shadow-steel-blue/20 hover:ring-steel-blue/40">
            <img 
              [src]="director()!.imageUrl" 
              [alt]="director()!.name + ' photo'"
              class="w-full h-full object-cover object-center transition-transform duration-500 group-hover:scale-110"
            />
            <!-- Gradient overlay on hover -->
            <div class="absolute inset-0 bg-gradient-to-t from-deep-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
          </div>
          <div class="text-left w-full max-w-[180px] xs:max-w-[200px] sm:max-w-[240px] md:max-w-[280px]">
            <h3 class="text-base sm:text-lg md:text-xl font-semibold text-text-soft break-words group-hover:text-steel-blue transition-colors duration-200">
              {{ director()!.name }}
            </h3>
          </div>
        </div>
      } @else {
        <div class="py-8 sm:py-10 md:py-12 text-left">
          <p class="text-sm sm:text-base text-steel-blue/60 italic">Director information not available.</p>
        </div>
      }
    </div>
  </div>
</section>
