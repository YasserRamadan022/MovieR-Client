<section class="movie-trailer w-full mt-6 sm:mt-8">
  <div class="flex flex-col gap-4 sm:gap-5 md:gap-6">
    <h2 class="text-xl sm:text-2xl md:text-3xl font-bold text-text-soft">
      {{ title() }}
    </h2>

    <div class="relative w-full group">
      <div class="relative w-full rounded-lg md:rounded-xl overflow-hidden border-2 border-steel-blue/30 shadow-2xl">
        @if (!isPlaying()) {
          <div class="absolute inset-0 bg-gradient-to-br from-steel-blue/10 via-transparent to-deep-black/50 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none z-0"></div>
        }
        <div class="relative w-full" style="padding-bottom: 56.25%;">
          @if (!isPlaying()) {
            <div class="absolute inset-0 bg-deep-black cursor-pointer" (click)="playVideo($event)">
              @if (thumbnailUrl()) {
                <img 
                  [src]="thumbnailUrl()" 
                  [alt]="title() + ' trailer thumbnail'"
                  class="w-full h-full object-cover"
                />
              } @else {
                <div class="w-full h-full bg-gradient-to-br from-slate-dark via-charcoal to-deep-black"></div>
              }
              <div class="absolute inset-0 bg-deep-black/40"></div>
              <div class="absolute inset-0 flex items-center justify-center">
                <button
                  (click)="playVideo($event)"
                  class="group/play relative z-10 focus:outline-none focus:ring-4 focus:ring-steel-blue/50 rounded-full transition-all duration-300 hover:scale-110 active:scale-95"
                  aria-label="Play {{ title() }}"
                >
                  <div class="absolute inset-0 rounded-full bg-steel-blue/20 blur-xl group-hover/play:bg-steel-blue/40 transition-all duration-300"></div>       
                  <div class="relative w-20 h-20 sm:w-24 sm:h-24 md:w-28 md:h-28 bg-steel-blue/90 group-hover/play:bg-steel-blue rounded-full flex items-center justify-center shadow-2xl border-2 border-text-soft/20 group-hover/play:border-text-soft/40 transition-all duration-300">
                    <svg 
                      class="w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 text-text-soft ml-1" 
                      fill="currentColor" 
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <path d="M8 5v14l11-7z"/>
                    </svg>
                  </div>
                </button>
              </div>     
              <div class="absolute bottom-6 left-6 right-6 sm:bottom-8 sm:left-8 sm:right-8">
                <p class="text-text-soft text-sm sm:text-base md:text-lg font-semibold drop-shadow-lg">
                  Click to watch trailer
                </p>
              </div>
            </div>
          }
          
          @if (isPlaying() && safeTrailerUrl()) {
            <iframe
              [src]="safeTrailerUrl()"
              [title]="title()"
              class="absolute top-0 left-0 w-full h-full z-10"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen
              frameborder="0"
            ></iframe>
          }
        </div>
      </div>
    </div>
  </div>
</section>
